<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.S.B.I Wizard</title>
</head>
<body>
    <h1>Choose a partition to backup</h1>
    <div id="partitionList"></div>
    <button onclick="window.location.href = 'os.html';">Back</button>
    <button id="discBtn">Start</button>
    <template id="disclamerTemp">
        Backup is NOT guaranteed.
        <div></div>
        Failures may occur due to:
        <ul>
            <li>Disk errors</li>
            <li>Power loss</li>
            <li>Incompatible systems</li>
        </ul>
        Verify your backup manually if the data is critical.
        <div></div>
        Type "CONTINUE WITHOUT GUARANTEE" to proceed:
        <input id="ulliInput" type="text" placeholder="Type here..." oninput="document.getElementById('startBtn').disabled = this.value.trim() !== 'CONTINUE WITHOUT GUARANTEE';">
        <button id="startBtn" disabled>Start</button>

    </template>

    <script>
        const partitionList = document.getElementById('partitionList');
        const disclamerBtn = document.getElementById('discBtn')
        const disclamerTemp = document.getElementById('disclamerTemp')
        
        function renderPartitions(parts) {
            partitionList.innerHTML = '';
            if (!Array.isArray(parts) || parts.length === 0) {
                const p = document.createElement('p');
                p.textContent = 'No partitions available';
                partitionList.appendChild(p);
                return;
            }
            parts.forEach(p => {
                if (!p || !p.device) return;
                if (String(p.device).toUpperCase() === 'C:') return;
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = p.device;
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + p.device));
                partitionList.appendChild(label);
                partitionList.appendChild(document.createElement('br'));
            });
        }

        async function loadState() {
            try {
                const resp = await fetch('state.json', { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                renderPartitions(data.partitions || []);
            } catch (err) {
                renderPartitions([]);
                console.warn('loadState error:', err);
            }
        }

        async function postSelection() {
            const selected = Array.from(partitionList.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            try {
                await fetch('/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ selected_partitions: selected })
                });
            } catch (err) {
                console.warn('postSelection error:', err);
            }
            window.location.href = 'instalacion.html';
        }

        function disclamer (){
            if (document.querySelectorAll('input[type="checkbox"]:checked').length === 0) {
                postSelection();
                return;
            }
            console.log("checbox activa detectada")
            document.body.innerHTML = disclamerTemp.innerHTML;
            const startBtn = document.getElementById('startBtn');
            startBtn.addEventListener('click', postSelection);
        }

        disclamerBtn.addEventListener('click', disclamer);
        loadState();
    </script>
</body>
</html>
