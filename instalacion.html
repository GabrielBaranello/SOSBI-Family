<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.S.B.I Wizard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="not-flex">Installing</h1>
    </header>
    <main class="body">
        <p class="scrollable-box" id="LogBox"></p>
    </main>
    <footer>

        <button id="botonNext" onclick="window.location.href = 'usb.html';" class="not-flex" disabled>Next</button>
        <button onclick="window.location.href = 'usb.html';">Back</button>
        <button id="cancelButton">Cancel</button>
    </footer>
    <template id="canceling">
        <header>
            <h1 class="not-flex">Canceling...</h1>
        </header>
        <main class="body"></main>
        <footer>
            <button id="cancelButton" disabled>Close</button>
    </template>
    <template id="canceled">
        <header>
            <h1 class="not-flex">Instalation canceled</h1>
        </header>
        <main class="body"></main>
        <footer>
            <button id="cancelButton" >Close</button>
        </footer>  
    </template>

    <script>
        // Control cancel
        let canceled = false;
        document.getElementById("cancelButton").addEventListener("click", async function () {
            const canceledTemplate = document.getElementById("canceled");
            const cancelingTemplate = document.getElementById("canceling");

            // Cambiar a pantalla "canceling"
            document.body.innerHTML = cancelingTemplate.innerHTML;

            // Avisar al backend
            try {
                await fetch('/api/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cancel: true })
                });
            } catch (err) {
                console.warn('Error enviando cancel:', err);
            }
            canceled = true
        
            // Esperar hasta que state.json diga canceled = true
            while (true) {
                try {
                    const resp = await fetch('state.json', { cache: 'no-store' });
                
                    if (resp.ok) {
                        const data = await resp.json();
                    
                        if (data?.canceled === true) {
                            break; // salir del loop
                        }
                    }
                } catch (err) {
                    console.warn('Error leyendo estado:', err);
                }
            
                // Espera 1 segundo antes de volver a intentar
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        
            //  Cambiar a pantalla "canceled"
            document.body.innerHTML = canceledTemplate.innerHTML;
        
            console.debug("Cancelación completada");
        });

        // Installing animation (dots)
        let dots = 0;
        const installAnimation = setInterval(() => {
            dots = dots === 3 ? 1 : dots + 1;
            if (!canceled) {
                document.querySelector("h1").textContent = "Installing" + ".".repeat(dots);
            }
        }, 1000);

        // Log rendering
        const logBox = document.getElementById('LogBox');

        function renderMessages(messages) {
            logBox.innerHTML = '';
            messages.forEach(m => {
                const div = document.createElement('div');
                div.classList.add('log-entry');
                const typeClass = 'log-' + (m.type || 'info');
                div.classList.add(typeClass);
                div.textContent = m.message;
                if (m.ts) {
                    const ts = document.createElement('span');
                    ts.classList.add('log-ts');
                    ts.textContent = new Date(m.ts).toLocaleString();
                    div.appendChild(ts);
                }
                logBox.appendChild(div);
            });
            // auto scroll to bottom
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function loadLog() {
            try {
                let resp = await fetch('/api/log', {cache: 'no-store'});
                if (!resp.ok) {
                    resp = await fetch('log.json', {cache: 'no-store'});
                }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (Array.isArray(data.messages)) {
                    renderMessages(data.messages);
                } else if (Array.isArray(data)) {
                    renderMessages(data);
                }
            } catch (err) {
                // Fallback: mostrar mensaje local si fetch falla (p. ej. archivo local sin servidor)
                renderMessages([
                    {id:0, type:'error', message:'No se pudo cargar log.json. Abre el proyecto desde un servidor local para usar fetch.'}
                ]);
                console.warn('loadLog error:', err);
            }
        }

        // Carga inicial y polling cada 3s para actualizaciones simples
        async function startInstall() {
            try {
                await fetch('/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start_install: true })
                });
            } catch (err) {
                console.warn('startInstall error:', err);
            }
        }

        startInstall();
        loadLog();
        const logPoll = setInterval(() => { if (!canceled) loadLog(); }, 3000);
    </script>
</body>
</html>
